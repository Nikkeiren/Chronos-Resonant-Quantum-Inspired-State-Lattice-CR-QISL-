name: Independent Evidence Recipient Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-evidence:
    name: ${{ matrix.condition }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - condition: BFS-ALIGNED
            config: configs/independent_evidence_bfs_aligned.toml
          - condition: BFS-REVERSED
            config: configs/independent_evidence_bfs_reversed.toml
          - condition: BFS-INDEPENDENT-BALANCED
            config: configs/independent_evidence_bfs_independent_balanced.toml
          - condition: RANDOM-ALIGNED
            config: configs/independent_evidence_random_aligned.toml
          - condition: RANDOM-REVERSED
            config: configs/independent_evidence_random_reversed.toml
          - condition: RANDOM-INDEPENDENT-BALANCED
            config: configs/independent_evidence_random_independent_balanced.toml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --all-targets

      - name: Validate configuration
        run: cargo run --release -- validate --config "${{ matrix.config }}"

      - name: Run paired-seed batch
        run: |
          cargo run --release -- batch \
            --config "${{ matrix.config }}" \
            --out "out/${{ matrix.condition }}" \
            --seeds 30 \
            --seed-start 1 \
            --variants weighted_gossip,weighted_gossip_damping,phase_ablation,full_cr_qisl

      - name: Upload experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: independent-evidence-${{ matrix.condition }}
          path: out/${{ matrix.condition }}/
          if-no-files-found: error
          retention-days: 30
