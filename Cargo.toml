[package]
name = "crqisl"
version = "0.1.0"
edition = "2021"
description = "CR-QISL: experimental quantum-inspired classical distributed-state simulator (NOT a quantum implementation, NOT a proven consensus protocol)"
publish = false

[lib]
name = "crqisl"
path = "src/lib.rs"

[[bin]]
name = "crqisl"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
debug = false
